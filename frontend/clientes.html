<section class="vista-modulo">
    <h2>Módulo: Clientes</h2>
    <div class="acoes-modulo" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <button class="btn-nav" onclick="abrirModalCliente()" style="white-space: nowrap; flex-shrink: 0;">Novo Registro</button>
        <div style="display: flex; gap: 0.5rem; flex: 1 1 250px; min-width: 0;">
            <input type="text" id="termoBusca" placeholder="Buscar..." onkeydown="if(event.key === 'Enter') filtrarClientes(); if(event.key === 'Escape') limparFiltro();" style="flex: 1; min-width: 0; padding: 0.75rem; border: 1px solid var(--cor-borda); border-radius: 4px; background-color: var(--cor-fundo); color: var(--cor-texto);">
            <button onclick="filtrarClientes()" style="padding: 0.75rem; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Buscar</button>
            <button onclick="limparFiltro()" style="padding: 0.75rem; background-color: transparent; color: var(--cor-texto); border: 1px solid var(--cor-borda); border-radius: 4px; cursor: pointer; white-space: nowrap;">Limpar</button>
        </div>
    </div>
    <div id="lista-clientes" class="listagem-dados" style="margin-top: 1.5rem;">
        <p>Carregando dados da API...</p>
    </div>
</section>

<div id="modalCliente" class="modal">
    <div class="modal-conteudo" style="max-width: 800px;">
        <div class="modal-cabecalho">
            <h3 id="tituloModalCliente">Novo Cliente</h3>            
            <button class="btn-fechar" onclick="fecharModalCliente()">&times;</button>
        </div>
        <form id="formCliente" onsubmit="guardarCliente(event)">
            <input type="hidden" id="idCliente">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="grupo-form">
                    <label for="nomeCliente">Nome Completo</label>
                    <input type="text" id="nomeCliente" required>
                </div>
                <div class="grupo-form">
                    <label for="cpfCliente">CPF / CNPJ</label>
                    <input type="text" id="cpfCliente" required>
                </div>
                <div class="grupo-form">
                    <label for="tipoCliente">Tipo de Cliente</label>
                    <select id="tipoCliente">
                        <option value="">Selecione...</option>
                        <option value="Fisica">Pessoa Física</option>
                        <option value="Juridica">Pessoa Jurídica</option>
                    </select>
                </div>
                <div class="grupo-form">
                    <label for="telefoneCliente">Telefone</label>
                    <input type="text" id="telefoneCliente">
                </div>
                <div class="grupo-form">
                    <label for="emailCliente">E-mail</label>
                    <input type="email" id="emailCliente">
                </div>
                <div class="grupo-form">
                    <label for="cepCliente">CEP</label>
                    <input type="text" id="cepCliente">
                </div>
                <div class="grupo-form">
                    <label for="ufCliente">Estado (UF)</label>
                    <select id="ufCliente" onchange="carregarCidades(this.value)" required>
                        <option value="">Selecione o Estado</option>
                    </select>
                </div>
                <div class="grupo-form">
                    <label for="cidadeCliente">Cidade</label>
                    <select id="cidadeCliente" required>
                        <option value="">Selecione a Cidade</option>
                    </select>
                </div>
                <div class="grupo-form">
                    <label for="bairroCliente">Bairro</label>
                    <input type="text" id="bairroCliente">
                </div>
                <div class="grupo-form">
                    <label for="logradouroCliente">Logradouro</label>
                    <input type="text" id="logradouroCliente">
                </div>
                <div class="grupo-form">
                    <label for="numeroCliente">Número</label>
                    <input type="text" id="numeroCliente">
                </div>
                <div class="grupo-form">
                    <label for="complementoCliente">Complemento</label>
                    <input type="text" id="complementoCliente">
                </div>
            </div>
            <div class="grupo-form" style="margin-top: 1rem;">
                <label for="observacaoCliente">Observações</label>
                <textarea id="observacaoCliente" rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px;"></textarea>
            </div>

            <div class="modal-rodape" style="margin-top: 1.5rem;">
                <button type="button" class="btn-cancelar" onclick="fecharModalCliente()">Cancelar</button>
                <button type="submit" class="btn-guardar">Guardar</button>
            </div>
        </form>
    </div>
</div>
