<section class="vista-modulo">
    <h2>Módulo: Clientes</h2>
    <div class="acoes-modulo" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: space-between;">
        <button class="btn-nav" onclick="abrirModalCliente()">Novo Registo</button>
        <div style="display: flex; gap: 0.5rem; flex: 1; min-width: 280px;">
            <input type="text" id="termoBusca" placeholder="Buscar por nome ou CPF..." onkeydown="if(event.key === 'Enter') filtrarClientes(); if(event.key === 'Escape') limparFiltro();" style="flex: 1; width: 100%; padding: 0.75rem; border: 1px solid var(--cor-borda); border-radius: 4px; background-color: var(--cor-fundo); color: var(--cor-texto);">
            <button onclick="filtrarClientes()" style="padding: 0.75rem 1rem; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Buscar</button>
            <button onclick="limparFiltro()" style="padding: 0.75rem 1rem; background-color: transparent; color: var(--cor-texto); border: 1px solid var(--cor-borda); border-radius: 4px; cursor: pointer; white-space: nowrap;">Limpar</button>
        </div>
    </div>



    <div id="lista-clientes" class="listagem-dados" style="margin-top: 1.5rem;">
        <p>A carregar dados da API...</p>
    </div>
</section>

<div id="modalCliente" class="modal">
    <div class="modal-conteudo">
        <div class="modal-cabecalho">
            <h3 id="tituloModalCliente">Novo Cliente</h3>            
            <button class="btn-fechar" onclick="fecharModalCliente()">&times;</button>
        </div>
        <form id="formCliente" onsubmit="guardarCliente(event)">
            <input type="hidden" id="idCliente">
            <div class="grupo-form">
                <label for="nomeCliente">Nome Completo</label>
                <input type="text" id="nomeCliente" required>
            </div>
            <div class="grupo-form">
                <label for="cpfCliente">CPF</label>
                <input type="text" id="cpfCliente" required>
            </div>
            <div class="grupo-form">
                <label for="telefoneCliente">Telefone</label>
                <input type="text" id="telefoneCliente">
            </div>
            <div class="grupo-form">
                <label for="emailCliente">E-mail</label>
                <input type="email" id="emailCliente">
            </div>
            <div class="modal-rodape">
                <button type="button" class="btn-cancelar" onclick="fecharModalCliente()">Cancelar</button>
                <button type="submit" class="btn-guardar">Guardar</button>
            </div>
        </form>
    </div>
</div>
