<div class="acoes-modulo" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
    <button class="btn-nav" onclick="abrirModalCor()" style="white-space: nowrap; flex-shrink: 0;">Novo Registro</button>
    <div style="display: flex; gap: 0.5rem; flex: 1 1 250px; min-width: 0;">
        <input type="text" id="termoBuscaCor" placeholder="Buscar cor por nome..." onkeydown="if(event.key === 'Enter') filtrarCores(); if(event.key === 'Escape') limparFiltroCor();" style="flex: 1; min-width: 0; padding: 0.75rem; border: 1px solid var(--cor-borda); border-radius: 4px; background-color: var(--cor-fundo); color: var(--cor-texto);">
        <button onclick="filtrarCores()" style="padding: 0.75rem; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Buscar</button>
        <button onclick="limparFiltroCor()" style="padding: 0.75rem; background-color: transparent; color: var(--cor-texto); border: 1px solid var(--cor-borda); border-radius: 4px; cursor: pointer; white-space: nowrap;">Limpar</button>
    </div>
</div>

<div class="listagem-dados" style="overflow-x: auto; width: 100%; display: block;">
    <div id="lista-cores"></div>
</div>

<div id="modalCor" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="modal-conteudo" style="background-color: var(--cor-fundo); padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px;">
        <h2 id="tituloModalCor" style="margin-bottom: 1.5rem;">Nova Cor</h2>
        <form id="formCor" onsubmit="guardarCor(event)">
            <input type="hidden" id="idCor">
            <div style="margin-bottom: 1rem;">
                <label for="nomeCor" style="display: block; margin-bottom: 0.5rem;">Nome da Cor:</label>
                <input type="text" id="nomeCor" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="tipoCor" style="display: block; margin-bottom: 0.5rem;">Tipo da Cor:</label>
                <select id="tipoCor" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px; background-color: var(--cor-fundo); color: var(--cor-texto);">
                    <option value="">Selecione um tipo...</option>
                    <option value="Letra">Letra</option>
                    <option value="Fundo">Fundo</option>
                    <option value="Ambos">Ambos</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                <button type="button" onclick="fecharModalCor()" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid var(--cor-borda); background: transparent; border-radius: 4px;">Cancelar</button>
                <button type="submit" class="btn-guardar" style="padding: 0.5rem 1rem; cursor: pointer; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px;">Guardar</button>
            </div>
        </form>
    </div>
</div>
