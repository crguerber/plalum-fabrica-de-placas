<div class="acoes-modulo" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
    <button class="btn-nav" onclick="abrirModalPreco()" style="white-space: nowrap; flex-shrink: 0;">Novo Registro</button>
    <div style="display: flex; gap: 0.5rem; flex: 1 1 250px; min-width: 0;">
        <input type="date" id="termoBuscaPreco" onkeydown="if(event.key === 'Enter') filtrarPrecos(); if(event.key === 'Escape') limparFiltroPreco();" style="flex: 1; min-width: 0; padding: 0.75rem; border: 1px solid var(--cor-borda); border-radius: 4px; background-color: var(--cor-fundo); color: var(--cor-texto);">
        <button onclick="filtrarPrecos()" style="padding: 0.75rem; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;">Buscar</button>
        <button onclick="limparFiltroPreco()" style="padding: 0.75rem; background-color: transparent; color: var(--cor-texto); border: 1px solid var(--cor-borda); border-radius: 4px; cursor: pointer; white-space: nowrap;">Limpar</button>
    </div>
</div>

<div class="listagem-dados" style="overflow-x: auto; width: 100%; display: block;">
    <div id="lista-precos"></div>
</div>

<div id="modalPreco" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="modal-conteudo" style="background-color: var(--cor-fundo); padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px;">
        <h2 id="tituloModalPreco" style="margin-bottom: 1.5rem;">Nova Tabela de Preços</h2>
        <form id="formPreco" onsubmit="guardarPreco(event)">
            <input type="hidden" id="idTabelaPrecos">
            <div style="margin-bottom: 1rem;">
                <label for="dataVigencia" style="display: block; margin-bottom: 0.5rem;">Data de Vigência:</label>
                <input type="date" id="dataVigencia" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="precoMaterial" style="display: block; margin-bottom: 0.5rem;">Preço do Material (R$):</label>
                <input type="number" step="0.01" id="precoMaterial" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="precoLetra" style="display: block; margin-bottom: 0.5rem;">Preço da Letra (R$):</label>
                <input type="number" step="0.01" id="precoLetra" required style="width: 100%; padding: 0.5rem; border: 1px solid var(--cor-borda); border-radius: 4px;">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                <button type="button" onclick="fecharModalPreco()" style="padding: 0.5rem 1rem; cursor: pointer; border: 1px solid var(--cor-borda); background: transparent; border-radius: 4px;">Cancelar</button>
                <button type="submit" class="btn-guardar" style="padding: 0.5rem 1rem; cursor: pointer; background-color: var(--cor-primaria); color: white; border: none; border-radius: 4px;">Guardar</button>
            </div>
        </form>
    </div>
</div>
